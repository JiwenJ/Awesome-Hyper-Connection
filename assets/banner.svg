    <path d="M1115 123 H1121 M1118 120 V126 M1115 144 H1121 M1118 141 V147 M1115 165 H1121 M1118 162 V168 M1115 186 H1121 M1118 183 V189" fill="none" stroke="#0E7C7B" stroke-width="1.25"/>
